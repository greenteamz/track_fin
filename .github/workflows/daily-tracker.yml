name: Daily Portfolio Tracker

on:
  # Run daily at IST 7:30 AM = UTC 2:00 AM
  schedule:
    - cron: "0 2 * * *"

  # Run on every push / PR for CI checks
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual trigger
  workflow_dispatch:

jobs:
  # ── Job 1: Lint & basic validation ─────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check all Python files
        run: python -m py_compile cli.py && python -m py_compile app.py && python -m py_compile scheduler.py && python -m py_compile config.py && python -m py_compile generate_report.py

      - name: Validate imports
        run: |
          python -c "
          from db.database import init_db, get_connection
          from agents.price_fetcher import fetch_all_nav, fetch_stock_prices
          from agents.evaluator import run_evaluation
          from agents.cas_excel_parser import parse_cas_excel
          from agents.cdsl_parser import parse_cdsl_statement
          from agents.cas_parser import SELL_TX_TYPES
          print('All imports OK')
          "

  # ── Job 3: Daily fetch (only on schedule or manual trigger) ────────────────
  daily-fetch:
    name: Daily NAV & Stock Fetch
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "MF_PAN=${{ secrets.MF_PAN }}" > .env
          echo "MF_CAS_PASSWORD=${{ secrets.MF_CAS_PASSWORD }}" >> .env
          echo "STOCK_TICKERS=${{ secrets.STOCK_TICKERS }}" >> .env
          echo "DB_PATH=./portfolio.db" >> .env

      - name: Restore portfolio database
        id: cache-db
        uses: actions/cache@v4
        with:
          path: portfolio.db
          key: portfolio-db-${{ github.run_number }}
          restore-keys: |
            portfolio-db-

      - name: Seed DB from release (first run only)
        if: steps.cache-db.outputs.cache-hit != 'true' && hashFiles('portfolio.db') == ''
        run: |
          echo "No cached DB found — downloading seed from release..."
          curl -sL -o portfolio.db \
            "https://github.com/greenteamz/track_fin/releases/download/db-seed-v1/portfolio.db"
          ls -la portfolio.db

      - name: Initialize DB & fetch NAV
        run: |
          python -c "from db.database import init_db; init_db()"
          python cli.py fetch-nav

      - name: Generate Excel report
        run: python generate_report.py

      - name: Commit & push report
        run: |
          git config user.name "greenteamz"
          git config user.email "greenteamz@users.noreply.github.com"
          git add portfolio_report.xlsx
          git diff --cached --quiet || git commit -m "Daily portfolio update $(date -u +%Y-%m-%d)"
          git push

      - name: Save updated database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: portfolio.db
          key: portfolio-db-${{ github.run_number }}
